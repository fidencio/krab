name: Build SBOMs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: sbom-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  charts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - run: npm ci
      - name: Build chart SBOMs and check rendered images
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          mkdir -p dist-chart dist-precheck dist-sbom
          helm dependency build charts/krab
          helm package charts/krab --destination dist-chart
          helm package charts/precheck --destination dist-precheck
          node --import tsx scripts/chart-sbom.ts \
            "dist-chart/krab-${version}.tgz" \
            "dist-sbom/krab-${version}.spdx.json"
          node --import tsx scripts/chart-sbom.ts \
            "dist-precheck/krab-precheck-${version}.tgz" \
            "dist-sbom/krab-precheck-${version}.spdx.json"

          helm template krab charts/krab --namespace kata-system \
            > "${RUNNER_TEMP}/krab-default-render.yaml"
          cat > "${RUNNER_TEMP}/nvidia-values.yaml" <<'VALUES'
          nvidia:
            enabled: true
          kata-device-provisioner:
            profiles:
              release-smoke:
                enabled: true
                ccMode: "off"
          VALUES
          helm template krab charts/krab --namespace kata-system \
            --values "${RUNNER_TEMP}/nvidia-values.yaml" \
            > "${RUNNER_TEMP}/krab-nvidia-render.yaml"
          helm template krab-precheck charts/precheck --namespace krab-precheck \
            > "${RUNNER_TEMP}/krab-precheck-render.yaml"
          node --import tsx scripts/verify-sbom-images.ts \
            "dist-sbom/krab-${version}.spdx.json" \
            "${RUNNER_TEMP}/krab-default-render.yaml" \
            "${RUNNER_TEMP}/krab-nvidia-render.yaml"
          node --import tsx scripts/verify-sbom-images.ts \
            "dist-sbom/krab-precheck-${version}.spdx.json" \
            "${RUNNER_TEMP}/krab-precheck-render.yaml"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: chart-sboms
          path: dist-sbom/*.spdx.json
          if-no-files-found: error

  preflight_image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Install checksum-verified Syft through the release API
        id: syft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/install-syft.py
      - name: Build and scan each pre-flight image architecture
        shell: bash
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          mkdir -p dist-sbom
          docker buildx build \
            --file Dockerfile.precheck \
            --platform linux/amd64,linux/arm64,linux/ppc64le,linux/s390x \
            --output "type=oci,dest=${RUNNER_TEMP}/krab-preflight.oci.tar" \
            .
          for arch in amd64 arm64 ppc64le s390x; do
            "${SYFT}" "${RUNNER_TEMP}/krab-preflight.oci.tar" \
              --from oci-archive \
              --platform "linux/${arch}" \
              -o "spdx-json=dist-sbom/krab-preflight-${version}-linux-${arch}.spdx.json"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: preflight-image-sboms
          path: dist-sbom/*.spdx.json
          if-no-files-found: error

  collector_image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Install checksum-verified Syft through the release API
        id: syft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/install-syft.py
      - name: Build and scan each collector image architecture
        shell: bash
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          mkdir -p dist-sbom
          docker buildx build \
            --file Dockerfile.collector \
            --platform linux/amd64,linux/arm64,linux/ppc64le,linux/s390x \
            --output "type=oci,dest=${RUNNER_TEMP}/krab-collector.oci.tar" \
            .
          for arch in amd64 arm64 ppc64le s390x; do
            "${SYFT}" "${RUNNER_TEMP}/krab-collector.oci.tar" \
              --from oci-archive \
              --platform "linux/${arch}" \
              -o "spdx-json=dist-sbom/krab-collector-${version}-linux-${arch}.spdx.json"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: collector-image-sboms
          path: dist-sbom/*.spdx.json
          if-no-files-found: error
