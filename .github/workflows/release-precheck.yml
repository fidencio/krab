name: Publish KRAB pre-flight artifacts

on:
  push:
    branches: [main, dev]
    paths:
      - Dockerfile.precheck
      - public/node-precheck.sh
      - preflight/**
      - charts/precheck/**
      - .github/workflows/release-precheck.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: precheck-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: azure/setup-helm@v5

      - name: Select artifact version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: //p' charts/precheck/Chart.yaml)"
          if [[ "${GITHUB_REF_NAME}" == "dev" ]]; then
            version="${version}-dev"
          fi
          echo "VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Validate chart
        run: |
          bash -n public/node-precheck.sh charts/precheck/files/collect.sh
          helm lint charts/precheck
          helm template krab-precheck charts/precheck --namespace default >/dev/null

      - name: Test preflight
        run: cargo test --manifest-path preflight/Cargo.toml --locked

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish probe image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.precheck
          push: true
          platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x
          tags: ghcr.io/fidencio/krab-preflight:${{ env.VERSION }}
          labels: org.opencontainers.image.source=https://github.com/fidencio/krab

      - name: Publish OCI chart
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-precheck
          helm package charts/precheck --version "${VERSION}" --app-version "${VERSION}" --destination dist-precheck
          helm registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin <<<"${{ secrets.GITHUB_TOKEN }}"
          helm push "dist-precheck/krab-precheck-${VERSION}.tgz" oci://ghcr.io/fidencio
          helm registry logout ghcr.io

      - name: Verify anonymous access
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io
          helm show chart oci://ghcr.io/fidencio/krab-precheck --version "${VERSION}"
          docker buildx imagetools inspect "ghcr.io/fidencio/krab-preflight:${VERSION}"
