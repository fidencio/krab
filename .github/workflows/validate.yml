name: Validate pull request

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: oras-project/setup-oras@v2.0.1
        with:
          version: 1.3.3
      - name: Check generated files
        run: |
          npm run generate
          git diff --exit-code -- \
            package-lock.json preflight/Cargo.toml preflight/Cargo.lock \
            charts/krab/Chart.yaml charts/krab/values.yaml \
            charts/precheck/Chart.yaml charts/precheck/values.yaml \
            Dockerfile.precheck upstream/precheck-image.lock.json upstream/architecture.yaml \
            README.md charts/krab/README.md CHANGELOG.md src/generated
      - run: npm test
      - run: npm run test:chart
      - run: npm run lint
      - run: npm run build
      - run: npm run verify:precheck-image
      - run: npm run verify:erofs-image
      - uses: docker/setup-buildx-action@v3
      - name: Build and smoke test the distroless precheck image
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --file Dockerfile.precheck \
            --tag krab-preflight:test --load .
          docker run --rm --privileged --volume /:/host:ro \
            --volume /proc:/host/proc:ro --volume /sys:/host/sys:ro \
            --volume /dev:/host/dev:ro krab-preflight:test \
            | ./node_modules/.bin/tsx scripts/check-node-report.ts
      - name: Build and smoke test the collector image
        run: |
          docker buildx build --platform linux/amd64 --file Dockerfile.collector \
            --tag krab-collector:test --load .
          docker run --rm --entrypoint /bin/bash \
            --volume "${PWD}/test:/tests:ro" krab-collector:test \
            /tests/collector-smoke.sh /usr/local/bin/krab-collect
      - name: Validate published chart dependencies
        run: |
          helm dependency update charts/krab
          npm run test:helm
          npm run test:controller:render

  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install pre-flight Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt
      - name: Check pre-flight binary and cache
        working-directory: preflight
        run: |
          cargo +1.95.0 fmt --check
          cargo +1.95.0 test --locked

  controller:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install controller Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
      - name: Check controller
        working-directory: controller
        run: |
          cargo +1.96.0 fmt --check
          cargo +1.96.0 test --locked
          cargo +1.96.0 clippy --locked --all-targets -- -D warnings
      - name: Build controller image
        run: docker build --file controller/Dockerfile --tag krab-controller:test .
      - name: Check token-free host identity guard
        run: |
          docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --volume /etc/machine-id:/host-machine-id:ro \
            krab-controller:test check-machine "$(cat /etc/machine-id)"
          if docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --volume /etc/machine-id:/host-machine-id:ro \
            krab-controller:test check-machine wrong-machine; then
            echo "ERROR: identity guard accepted a different machine"
            exit 1
          fi
