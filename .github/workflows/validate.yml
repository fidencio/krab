name: Validate pull request

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: oras-project/setup-oras@v2.0.1
        with:
          version: 1.3.3
      - name: Check generated files
        run: |
          npm run generate
          git diff --exit-code -- \
            package-lock.json charts/krab/Chart.yaml charts/krab/values.yaml \
            charts/precheck/Chart.yaml charts/precheck/values.yaml \
            Dockerfile.precheck upstream/precheck-image.lock.json upstream/architecture.yaml \
            README.md charts/krab/README.md CHANGELOG.md src/generated
      - run: npm test
      - run: npm run test:chart
      - run: npm run lint
      - run: npm run build
      - run: npm run verify:precheck-image
      - uses: docker/setup-buildx-action@v3
      - name: Build and smoke test the distroless precheck image
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --file Dockerfile.precheck \
            --tag krab-preflight:test --load .
          docker run --rm --privileged --volume /:/host:ro \
            --volume /proc:/host/proc:ro --volume /sys:/host/sys:ro \
            --volume /dev:/host/dev:ro krab-preflight:test \
            | ./node_modules/.bin/tsx scripts/check-node-report.ts
      - name: Validate published chart dependencies
        run: |
          helm dependency update charts/krab
          helm lint charts/krab
          helm template krab charts/krab --namespace kata-system >/dev/null
          helm template krab charts/krab --namespace kata-system \
            --set nvidia.enabled=true \
            --set kata-device-provisioner.profiles.release-smoke.enabled=true \
            --set-string kata-device-provisioner.profiles.release-smoke.ccMode=off \
            >/dev/null
