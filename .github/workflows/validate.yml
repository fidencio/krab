name: Validate pull request

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: 1.3.3
      - name: Install shared browser engine toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --target wasm32-unknown-unknown
      - uses: ./.github/actions/cache-browser-engine
      - name: Check generated files
        run: |
          npm run generate
          npm run build:core
          git diff --exit-code -- \
            package-lock.json preflight/Cargo.toml preflight/Cargo.lock \
            cli/Cargo.toml cli/Cargo.lock \
            charts/krab/Chart.yaml charts/krab/values.yaml charts/krab/templates/_kata-node-job-base.tpl \
            charts/precheck/Chart.yaml charts/precheck/values.yaml \
            Dockerfile.precheck upstream/precheck-image.lock.json upstream/architecture.yaml \
            README.md charts/krab/README.md CHANGELOG.md src/generated
      - run: npm test
      - run: npm run test:chart
      - run: npm run lint
      - run: npm run build
      - run: npm run verify:precheck-image
      - run: npm run verify:erofs-image
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build and smoke test the distroless precheck image
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --file Dockerfile.precheck \
            --tag krab-preflight:test --load .
          docker run --rm --privileged --volume /:/host:ro \
            --volume /proc:/host/proc:ro --volume /sys:/host/sys:ro \
            --volume /dev:/host/dev:ro krab-preflight:test \
            | ./node_modules/.bin/tsx scripts/check-node-report.ts
      - name: Build and smoke test the collector image
        run: |
          docker buildx build --platform linux/amd64 --file Dockerfile.collector \
            --tag krab-collector:test --load .
          docker run --rm --entrypoint /bin/bash \
            --volume "${PWD}/test:/tests:ro" krab-collector:test \
            /tests/collector-smoke.sh /usr/local/bin/krab-collect
      - name: Validate published chart dependencies
        run: |
          helm dependency update charts/krab
          npm run test:helm

  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pre-flight Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt
      - name: Check pre-flight binary and cache
        working-directory: preflight
        run: |
          cargo +1.95.0 fmt --check
          cargo +1.95.0 test --locked
