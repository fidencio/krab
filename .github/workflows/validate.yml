name: Validate pull request

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check generated files
        run: |
          npm run generate
          git diff --exit-code -- \
            package-lock.json charts/krab/Chart.yaml charts/krab/values.yaml \
            charts/precheck/Chart.yaml upstream/architecture.yaml \
            README.md charts/krab/README.md CHANGELOG.md src/generated
      - run: npm test
      - run: npm run test:chart
      - run: npm run lint
      - run: npm run build
