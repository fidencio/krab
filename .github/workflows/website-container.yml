name: Self-hosted website

on:
  pull_request:
    paths: ['Dockerfile.website', 'package*.json', 'core/**', 'src/**', 'public/**', 'examples/product-profiles/**', 'charts/krab/values.schema.json', 'upstream/erofs-utils-image.lock.json', 'scripts/build-core.py', '.github/workflows/website-container.yml']
  push:
    branches: [main]
    paths: ['Dockerfile.website', 'package*.json', 'core/**', 'src/**', 'public/**', 'examples/product-profiles/**', 'charts/krab/values.schema.json', 'upstream/erofs-utils-image.lock.json', 'scripts/build-core.py', '.github/workflows/website-container.yml']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: website-container-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  website:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build the portable static website
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.website
          tags: krab-website:test
          load: true
          cache-from: type=gha,scope=website
          cache-to: type=gha,scope=website,mode=max
      - name: Smoke the generic and configured static website
        run: |
          docker run --detach --name krab-website --publish 127.0.0.1:8080:80 krab-website:test
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/ > /tmp/website.html; then break; fi
            sleep 1
          done
          test -s /tmp/website.html
          grep -q './assets/' /tmp/website.html
          docker cp krab-website:/usr/share/nginx/html dist-self-host
          docker cp examples/product-profiles/coco.json krab-website:/usr/share/nginx/html/krab-profile.json
          docker cp src/assets/brands/confidential-containers.svg krab-website:/usr/share/nginx/html/product-logo.svg
          curl --fail --silent http://127.0.0.1:8080/krab-profile.json | python3 -c 'import json,sys; assert json.load(sys.stdin)["id"] == "coco-example"'
          curl --fail --silent http://127.0.0.1:8080/product-logo.svg > /tmp/product-logo.svg
          test -s /tmp/product-logo.svg
      - name: Include a ready-to-copy example profile
        run: |
          mkdir -p dist-self-host/example-profiles/coco
          cp examples/product-profiles/coco.json dist-self-host/example-profiles/coco/krab-profile.json
          cp src/assets/brands/confidential-containers.svg dist-self-host/example-profiles/coco/product-logo.svg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: krab-self-host-${{ github.sha }}
          path: dist-self-host
          if-no-files-found: error
          retention-days: 14
      - name: Container diagnostics
        if: failure()
        run: docker logs krab-website || true
