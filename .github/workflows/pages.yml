name: Deploy GitHub Pages

on:
  push:
    branches: [main, dev]
  workflow_run:
    workflows: [Build PR preview]
    types: [completed]
  pull_request_target:
    types: [closed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          path: stable

      - name: Prepare development checkout
        shell: bash
        run: |
          set -euo pipefail

          if git -C stable show-ref --verify --quiet refs/remotes/origin/dev; then
            git -C stable worktree add --detach ../development refs/remotes/origin/dev
          else
            echo "::warning::dev branch does not exist yet; previewing main"
            cp -R stable development
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            stable/package-lock.json
            development/package-lock.json

      - name: Validate and build stable site
        working-directory: stable
        run: |
          npm ci
          npm run generate
          git diff --exit-code -- \
            package-lock.json charts/krab/Chart.yaml charts/krab/values.yaml \
            charts/precheck/Chart.yaml charts/precheck/values.yaml \
            Dockerfile.precheck upstream/precheck-image.lock.json \
            upstream/architecture.yaml README.md charts/krab/README.md \
            CHANGELOG.md src/generated
          npm test
          npm run test:chart
          npm run lint
          npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Validate and build development site
        working-directory: development
        run: |
          npm ci
          npm run generate
          git diff --exit-code -- \
            package-lock.json charts/krab/Chart.yaml charts/krab/values.yaml \
            charts/precheck/Chart.yaml charts/precheck/values.yaml \
            Dockerfile.precheck upstream/precheck-image.lock.json \
            upstream/architecture.yaml README.md charts/krab/README.md \
            CHANGELOG.md src/generated
          npm test
          npm run test:chart
          npm run lint
          npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/dev/

      - name: Compose stable and development sites
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p site/dev
          cp -R stable/dist/. site/
          cp -R development/dist/. site/dev/

      # This job uses only scripts from main. PR artifacts are copied as static
      # files; none of their contents are run with this workflow's token.
      - name: Add current PR previews
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: bash stable/scripts/compose-pr-previews.sh site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
        # deploy-pages#434: bundled @actions/artifact still loads core punycode.
        env:
          NODE_OPTIONS: --no-deprecation

      - name: Link previews from pull requests
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: bash scripts/comment-pr-previews.sh
