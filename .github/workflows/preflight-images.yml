name: Build preflight images

on:
  workflow_dispatch:
  pull_request:
    paths:
      - preflight/**
      - Dockerfile.precheck
      - .dockerignore
      - .github/workflows/preflight-images.yml
  push:
    branches: [main]
    paths:
      - preflight/**
      - Dockerfile.precheck
      - .dockerignore
      - .github/workflows/preflight-images.yml

permissions:
  contents: read

concurrency:
  group: preflight-images-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64, ppc64le, s390x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Cross-build the checker image on the native runner CPU
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.precheck
          platforms: linux/${{ matrix.architecture }}
          load: true
          tags: krab-preflight:test
          cache-from: |
            type=gha,scope=preflight-${{ matrix.architecture }}
            type=gha,scope=preflight-release
          cache-to: type=gha,scope=preflight-${{ matrix.architecture }},mode=max
      # Execute the target binary, never its compiler, under emulation.
      - name: Smoke test the target executable and dynamic libraries
        run: |
          set -euo pipefail
          docker run --rm --read-only --platform linux/${{ matrix.architecture }} \
            --volume /:/host:ro --volume /proc:/host/proc:ro \
            --volume /sys:/host/sys:ro --volume /dev:/host/dev:ro \
            krab-preflight:test > report.json
          node --input-type=module - '${{ matrix.architecture }}' <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          const report = JSON.parse(readFileSync('report.json', 'utf8'))
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          assert.equal(report.node.checkerVersion, pkg.version)
          assert.equal(report.node.architecture, process.argv[2])
          assert.equal(report.schemaVersion, 2)
          NODE
