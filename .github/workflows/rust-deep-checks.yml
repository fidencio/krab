name: Rust deep checks

# Expensive interpreter/unused-dependency/size checks run away from the release path.
on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: rust-deep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unused:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        crate: [core, cli, preflight]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-udeps,cargo-bloat
      - name: Find unused dependencies
        working-directory: ${{ matrix.crate }}
        run: cargo +nightly udeps --locked --all-targets --all-features
      - name: Report release size
        working-directory: ${{ matrix.crate }}
        if: matrix.crate != 'core'
        run: cargo +nightly bloat --locked --release --all-features -n 20 >> "$GITHUB_STEP_SUMMARY"

  miri:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal --component miri
      - name: Interpret shared CPU profile and deployment policy tests
        working-directory: core
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: cargo +nightly miri test --locked --no-default-features
