name: Build PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-preview-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install shared browser engine toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --target wasm32-unknown-unknown

      - uses: ./.github/actions/cache-browser-engine
      - name: Validate generated files
        run: |
          npm run generate
          npm run build:core
          git diff --exit-code -- \
            package-lock.json charts/krab/Chart.yaml charts/krab/values.yaml charts/krab/templates/_kata-node-job-base.tpl \
            charts/precheck/Chart.yaml charts/precheck/values.yaml \
            Dockerfile.precheck upstream/precheck-image.lock.json \
            upstream/architecture.yaml README.md charts/krab/README.md \
            CHANGELOG.md src/generated
      - run: npm test
      - run: npm run test:chart
      - run: npm run lint
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/pr/${{ github.event.pull_request.number }}/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pr-preview-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: dist
          if-no-files-found: error

  deployments:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - name: Install native engine toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: pr-deployments-${{ runner.os }}-${{ hashFiles('cli/Cargo.lock', 'core/Cargo.lock') }}-${{ github.sha }}
          restore-keys: pr-deployments-${{ runner.os }}-${{ hashFiles('cli/Cargo.lock', 'core/Cargo.lock') }}-
      - name: Build the PR configuration engine and render deployments
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          cargo +1.95.0 build --locked --manifest-path cli/Cargo.toml
          python3 scripts/ci-pr-deployments.py --binary cli/target/debug/krab --revision "$SOURCE_REVISION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        id: artifact
        with:
          name: pr-deployments-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: dist-deployments
          if-no-files-found: error
          retention-days: 14
      - name: Link the deployment bundle
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: echo "[Download the chart, generated values, and rendered deployments]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
