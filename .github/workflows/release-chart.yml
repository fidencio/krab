name: Release KRAB Helm chart

on:
  workflow_dispatch:

concurrency:
  group: release-chart
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  CHART_PATH: charts/krab
  CHART_REGISTRY: oci://ghcr.io/fidencio
  CHART_REFERENCE: oci://ghcr.io/fidencio/krab
  PRECHECK_CHART_PATH: charts/precheck
  PRECHECK_CHART_REFERENCE: oci://ghcr.io/fidencio/krab-precheck

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: azure/setup-helm@v5

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3
      - uses: oras-project/setup-oras@v2.0.1
        with:
          version: 1.3.3

      - run: npm ci

      - name: Verify release versions and branch
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Chart releases must be dispatched from main"
            exit 1
          fi

          if ! git show-ref --verify --quiet refs/remotes/origin/dev; then
            echo "::error::The dev branch must exist before releasing"
            exit 1
          fi
          if ! git diff --quiet HEAD refs/remotes/origin/dev -- .; then
            echo "::error::main and dev must have identical trees before releasing"
            exit 1
          fi

          metadata="$(node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          import { parse } from 'yaml'

          const chart = parse(readFileSync('charts/krab/Chart.yaml', 'utf8'))
          const precheck = parse(readFileSync('charts/precheck/Chart.yaml', 'utf8'))
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          const match = chart.version.match(
            /^(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/,
          )
          if (!match) {
            throw new Error(`Chart version ${chart.version} is not valid SemVer`)
          }
          console.log([
            chart.version,
            chart.appVersion,
            pkg.version,
            precheck.version,
            precheck.appVersion,
            String(match[1] !== undefined),
            chart.annotations?.['artifacthub.io/prerelease'],
          ].join('\t'))
          NODE
          )"
          IFS=$'\t' read -r \
            chart_version \
            app_version \
            package_version \
            precheck_version \
            precheck_app_version \
            is_prerelease \
            artifacthub_prerelease <<<"${metadata}"

          if [[ "${chart_version}" != "${app_version}" || "${chart_version}" != "${package_version}" || \
                "${chart_version}" != "${precheck_version}" || "${chart_version}" != "${precheck_app_version}" ]]; then
            echo "::error::KRAB chart, pre-check chart, and package versions must all match"
            exit 1
          fi

          if [[ "${artifacthub_prerelease}" != "${is_prerelease}" ]]; then
            echo "::error::Artifact Hub prerelease annotation (${artifacthub_prerelease}) must match SemVer prerelease status (${is_prerelease})"
            exit 1
          fi

          echo "CHART_VERSION=${chart_version}" >> "${GITHUB_ENV}"
          echo "RELEASE_TAG=chart-v${chart_version}" >> "${GITHUB_ENV}"
          echo "IS_PRERELEASE=${is_prerelease}" >> "${GITHUB_ENV}"
          echo "PRECHECK_IMAGE=ghcr.io/fidencio/krab-preflight:${chart_version}" >> "${GITHUB_ENV}"

      - name: Regenerate and verify committed release data
        run: |
          npm run generate
          git diff --exit-code -- \
            package-lock.json charts/krab/Chart.yaml charts/krab/values.yaml \
            charts/precheck/Chart.yaml charts/precheck/values.yaml \
            Dockerfile.precheck upstream/precheck-image.lock.json \
            upstream/architecture.yaml README.md charts/krab/README.md \
            CHANGELOG.md src/generated

      - name: Validate application and chart contracts
        run: |
          npm test
          npm run test:chart
          npm run lint
          npm run build

      - name: Verify upstream OCI dependencies
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module > "${RUNNER_TEMP}/oci-dependencies.tsv" <<'NODE'
          import { readFileSync } from 'node:fs'
          import { parse } from 'yaml'

          const chart = parse(readFileSync('charts/krab/Chart.yaml', 'utf8'))
          for (const dependency of chart.dependencies ?? []) {
            if (dependency.repository?.startsWith('oci://')) {
              console.log([
                `${dependency.repository}/${dependency.name}`,
                dependency.version,
              ].join('\t'))
            }
          }
          NODE

          missing=()
          while IFS=$'\t' read -r reference version; do
            if ! helm show chart "${reference}" --version "${version}" >/dev/null 2>&1; then
              missing+=("${reference}:${version}")
            fi
          done < "${RUNNER_TEMP}/oci-dependencies.tsv"

          if (( ${#missing[@]} > 0 )); then
            printf '::error::KRAB chart publication is blocked. Missing upstream OCI chart: %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Validate pre-flight collector and probe
        run: |
          bash -n charts/precheck/files/collect.sh
          cargo test --manifest-path preflight/Cargo.toml --locked
          npm run verify:precheck-image

      - name: Build, lint, and render charts
        shell: bash
        run: |
          set -euo pipefail

          helm dependency build "${CHART_PATH}"
          helm lint "${CHART_PATH}"
          helm template krab "${CHART_PATH}" --namespace kata-system >/dev/null

          cat > "${RUNNER_TEMP}/nvidia-values.yaml" <<'VALUES'
          nvidia:
            enabled: true
          kata-device-provisioner:
            profiles:
              release-smoke:
                enabled: true
                ccMode: "off"
          VALUES
          helm template krab "${CHART_PATH}" \
            --namespace kata-system \
            --values "${RUNNER_TEMP}/nvidia-values.yaml" >/dev/null

          helm lint "${PRECHECK_CHART_PATH}"
          helm template krab-precheck "${PRECHECK_CHART_PATH}" --namespace krab-precheck >/dev/null

          mkdir -p dist-chart dist-precheck
          helm package "${CHART_PATH}" --destination dist-chart
          helm package "${PRECHECK_CHART_PATH}" --destination dist-precheck

      - name: Reconcile existing published chart
        shell: bash
        run: |
          set -euo pipefail

          chart_package="dist-chart/krab-${CHART_VERSION}.tgz"
          published_dir="${RUNNER_TEMP}/published-chart"
          local_tree="${RUNNER_TEMP}/local-chart"
          published_tree="${RUNNER_TEMP}/published-chart-tree"
          mkdir -p "${published_dir}" "${local_tree}" "${published_tree}"

          if helm pull "${CHART_REFERENCE}" \
            --version "${CHART_VERSION}" \
            --destination "${published_dir}" >/dev/null 2>&1; then
            published_package="${published_dir}/krab-${CHART_VERSION}.tgz"
            tar -xzf "${chart_package}" -C "${local_tree}"
            tar -xzf "${published_package}" -C "${published_tree}"
            if ! diff --recursive --brief --exclude Chart.lock \
              "${local_tree}/krab" \
              "${published_tree}/krab"; then
              echo "::error::Published chart ${CHART_VERSION} differs from this build"
              exit 1
            fi
            if ! diff --brief \
              <(sed '/^generated:/d' "${local_tree}/krab/Chart.lock") \
              <(sed '/^generated:/d' "${published_tree}/krab/Chart.lock"); then
              echo "::error::Published chart ${CHART_VERSION} has a different dependency lock"
              exit 1
            fi
            cp "${published_package}" "${chart_package}"
            echo "PUBLISH_CHART=false" >> "${GITHUB_ENV}"
            echo "Chart ${CHART_VERSION} is already published with identical content"
          else
            echo "PUBLISH_CHART=true" >> "${GITHUB_ENV}"
          fi

      - name: Reconcile existing published pre-flight chart
        shell: bash
        run: |
          set -euo pipefail

          chart_package="dist-precheck/krab-precheck-${CHART_VERSION}.tgz"
          published_dir="${RUNNER_TEMP}/published-precheck-chart"
          local_tree="${RUNNER_TEMP}/local-precheck-chart"
          published_tree="${RUNNER_TEMP}/published-precheck-chart-tree"
          mkdir -p "${published_dir}" "${local_tree}" "${published_tree}"

          if helm pull "${PRECHECK_CHART_REFERENCE}" \
            --version "${CHART_VERSION}" \
            --destination "${published_dir}" >/dev/null 2>&1; then
            published_package="${published_dir}/krab-precheck-${CHART_VERSION}.tgz"
            tar -xzf "${chart_package}" -C "${local_tree}"
            tar -xzf "${published_package}" -C "${published_tree}"
            if ! diff --recursive --brief \
              "${local_tree}/krab-precheck" \
              "${published_tree}/krab-precheck"; then
              echo "::error::Published pre-flight chart ${CHART_VERSION} differs from this build"
              exit 1
            fi
            cp "${published_package}" "${chart_package}"
            echo "PUBLISH_PRECHECK_CHART=false" >> "${GITHUB_ENV}"
            echo "Pre-flight chart ${CHART_VERSION} is already published with identical content"
          else
            echo "PUBLISH_PRECHECK_CHART=true" >> "${GITHUB_ENV}"
          fi

      - name: Prepare release checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum "dist-chart/krab-${CHART_VERSION}.tgz" "dist-precheck/krab-precheck-${CHART_VERSION}.tgz" \
            | sed 's#dist-chart/##; s#dist-precheck/##' > dist-chart/SHA256SUMS

      - name: Check existing pre-flight image
        shell: bash
        run: |
          set -euo pipefail
          if docker pull --platform linux/amd64 "${PRECHECK_IMAGE}" >/dev/null 2>&1; then
            revision="$(docker image inspect "${PRECHECK_IMAGE}" \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
            if [[ "${revision}" != "${GITHUB_SHA}" ]]; then
              echo "::error::Existing pre-flight image ${PRECHECK_IMAGE} was built from ${revision}, not ${GITHUB_SHA}"
              exit 1
            fi
            echo "PUBLISH_PRECHECK_IMAGE=false" >> "${GITHUB_ENV}"
          else
            echo "PUBLISH_PRECHECK_IMAGE=true" >> "${GITHUB_ENV}"
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish pre-flight image
        if: env.PUBLISH_PRECHECK_IMAGE == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.precheck
          push: true
          platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x
          tags: ${{ env.PRECHECK_IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/fidencio/krab
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Verify anonymous pre-flight image access
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io
          for attempt in {1..6}; do
            if docker buildx imagetools inspect "${PRECHECK_IMAGE}" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Pre-flight image is not anonymously pullable"
          exit 1

      - uses: actions/upload-artifact@v5
        with:
          name: krab-chart-${{ env.CHART_VERSION }}
          path: |
            dist-chart/krab-*.tgz
            dist-precheck/krab-precheck-*.tgz
            dist-chart/SHA256SUMS
          if-no-files-found: error

      - name: Attest chart package
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist-chart/krab-*.tgz

      - name: Attest pre-flight chart package
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist-precheck/krab-precheck-*.tgz

      - name: Publish and verify charts
        shell: bash
        run: |
          set -euo pipefail

          chart_package="dist-chart/krab-${CHART_VERSION}.tgz"
          precheck_package="dist-precheck/krab-precheck-${CHART_VERSION}.tgz"
          if [[ "${PUBLISH_CHART}" == "true" || "${PUBLISH_PRECHECK_CHART}" == "true" ]]; then
            echo "${{ secrets.GITHUB_TOKEN }}" |
              helm registry login ghcr.io \
                --username "${{ github.actor }}" \
                --password-stdin
          fi
          if [[ "${PUBLISH_PRECHECK_CHART}" == "true" ]]; then
            helm push "${precheck_package}" "${CHART_REGISTRY}"
          fi
          if [[ "${PUBLISH_CHART}" == "true" ]]; then
            helm push "${chart_package}" "${CHART_REGISTRY}"
          fi
          if [[ "${PUBLISH_CHART}" == "true" || "${PUBLISH_PRECHECK_CHART}" == "true" ]]; then
            helm registry logout ghcr.io
          fi

          for attempt in {1..6}; do
            if helm show chart "${CHART_REFERENCE}" --version "${CHART_VERSION}" >/dev/null 2>&1 && \
               helm show chart "${PRECHECK_CHART_REFERENCE}" --version "${CHART_VERSION}" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done

          echo "::error::Published charts are not anonymously pullable"
          exit 1

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            release_type_flags=(--prerelease --latest=false)
          else
            release_type_flags=(--prerelease=false --latest)
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              dist-chart/krab-*.tgz \
              dist-precheck/krab-precheck-*.tgz \
              dist-chart/SHA256SUMS \
              --clobber
            gh release edit "${RELEASE_TAG}" \
              --title "KRAB ${CHART_VERSION}" \
              "${release_type_flags[@]}"
          else
            gh release create "${RELEASE_TAG}" \
              dist-chart/krab-*.tgz \
              dist-precheck/krab-precheck-*.tgz \
              dist-chart/SHA256SUMS \
              --target "${GITHUB_SHA}" \
              --title "KRAB ${CHART_VERSION}" \
              --generate-notes \
              "${release_type_flags[@]}"
          fi
