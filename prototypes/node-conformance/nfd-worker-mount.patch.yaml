# Strategic merge patch for the EXISTING Helm NFD worker.
# Adjust workload name, namespace and container name to match your installation.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-feature-discovery-worker
  namespace: node-feature-discovery
spec:
  template:
    spec:
      containers:
        - name: worker
          volumeMounts:
            - name: krab-conformance-results
              mountPath: /run/krab/features
              readOnly: true
      volumes:
        - name: krab-conformance-results
          hostPath:
            path: /run/krab/features
            type: DirectoryOrCreate
