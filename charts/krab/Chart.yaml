apiVersion: v2
name: krab
description: Kata Reference Architecture Builder umbrella chart
type: application
version: 0.1.0-alpha.7
appVersion: "0.1.0-alpha.7"
home: https://github.com/fidencio/krab
icon: https://fidencio.github.io/krab/favicon.png
sources:
  - https://github.com/fidencio/krab
keywords:
  - kata-containers
  - confidential-containers
  - reference-architecture
  - gpu
maintainers:
  - name: Fabiano Fidêncio
    url: https://github.com/fidencio
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "true"
  artifacthub.io/changes: |
    - kind: added
      description: Combine CPU TEE and NVIDIA GPU paths in Custom deployments.
    - kind: added
      description: Show pinned component versions before deployment selection.
    - kind: changed
      description: Simplify pre-flight report choices and failing-node details.
    - kind: fixed
      description: Ignore existing GPU CC mode when selecting deployment options.
    - kind: changed
      description: Release the pre-flight image and chart with KRAB.
    - kind: fixed
      description: Use the published v0.2.0-rc.0 kata-device-plugin image tag.
    - kind: added
      description: Support optional deployment names and versioned values filenames.
dependencies:
  - name: node-feature-discovery
    version: "0.19.0"
    repository: https://kubernetes-sigs.github.io/node-feature-discovery/charts
  - name: kata-deploy
    version: "4.2.0"
    repository: oci://ghcr.io/kata-containers/kata-deploy-charts
  - name: kata-device-plugin
    version: "0.2.0-rc.0"
    repository: oci://ghcr.io/kata-containers/kata-device-plugin-charts
    condition: nvidia.enabled
  - name: kata-device-provisioner
    version: "0.1.0-alpha.1"
    repository: oci://ghcr.io/kata-containers/kata-device-provisioner-charts
    condition: nvidia.enabled
