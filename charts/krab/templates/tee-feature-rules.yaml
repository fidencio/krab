{{- /* Generated by npm run generate from kata-node-feature-rule. */ -}}
{{- if and (not (index .Values "kata-deploy" "enabled")) (or (index .Values "node-feature-discovery" "enabled") (.Capabilities.APIVersions.Has "nfd.k8s-sigs.io/v1alpha1")) }}
apiVersion: nfd.k8s-sigs.io/v1alpha1
kind: NodeFeatureRule
metadata:
  name: {{ .Release.Name }}-{{ .Release.Namespace }}-tee-capabilities
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  rules:
    - name: amd.sev-snp
      labels:
        amd.feature.node.kubernetes.io/snp: "true"
      extendedResources:
        sev-snp.amd.com/esids: "@cpu.security.sev.encrypted_state_ids"
      matchFeatures:
        - feature: cpu.security
          matchExpressions:
            sev.snp.enabled:
              op: Exists
    - name: intel.tdx
      labels:
        intel.feature.node.kubernetes.io/tdx: "true"
      extendedResources:
        tdx.intel.com/keys: "@cpu.security.tdx.total_keys"
      matchFeatures:
        - feature: cpu.security
          matchExpressions:
            tdx.enabled:
              op: Exists
{{- end }}
