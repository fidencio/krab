# Based on NVIDIA/nvrc; apply the same policy to each independent crate.
[advisories]
version = 2
ignore = []
# Keep transitive maintenance notices visible in cargo-audit; block direct use.
unmaintained = "workspace"
unsound = "all"

[licenses]
version = 2
allow = ["Apache-2.0", "MIT", "MIT-0", "CDLA-Permissive-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "BSL-1.0", "MPL-2.0", "OpenSSL"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
# Match NVRC: local path crates and revision-pinned Git crates omit registry versions.
# Builds use committed lockfiles with --locked; unknown sources are denied below.
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/kata-containers/pcilibs-rs"]
