[package]
name = "krab-preflight"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
description = "Read-only checks for Linux virtualization host capabilities"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
krab-core = { path = "../core", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.11"
# Shared PCI enumeration and capability tables; local checks never open BAR0 or mutate devices.
pcilibs-rs = { git = "https://github.com/kata-containers/pcilibs-rs", rev = "f6831fa878ec315ab477ccb88fbf8ec6cbd4cdca", features = ["cc"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
rstest = "0.28"
tempfile = "3"
